name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run test:collection
      - run: npm run test:catalogue
      - run: npm run test:japanese
      - run: npm run test:chinese
      - run: npm run test:portfolio
      - run: node --check scripts/import-pokemon-catalogue-db.mjs
      - run: node --check scripts/import-pokemon-catalogue.mjs
      - run: npm run build
